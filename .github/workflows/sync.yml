name: sync-channels

on:
  schedule:
    - cron: "7,37 * * * *"   # every hour (Jio tokens last only ~6 hours)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-channels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - run: python3 sync.py

      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/Entertainments.m3u
          git diff --cached --quiet || (git commit -m "sync links" && git pull --rebase && git push)